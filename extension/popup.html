<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --canvas: #efeeeb;
        --paper: #f7f6f3;
        --line: #d3d1cb;
        --muted: #85837e;
        --ink: #161616;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 320px;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font: 400 14px/1.4 system-ui, sans-serif;
      }
      .mark { font-size: 16px; font-weight: 500; }
      .mark sup { font-size: 12px; font-weight: 400; }
      .card { margin-top: 16px; padding: 8px; border-radius: 16px; background: var(--paper); }
      .thumb { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: var(--line); }
      .title {
        margin: 12px 4px 0;
        font-weight: 500;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .meta { margin: 4px 4px 4px; font-size: 12px; color: var(--muted); }
      .open {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--canvas);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      .open:hover { opacity: 0.85; }
      .open:disabled { opacity: 0.4; cursor: default; }
      .empty { margin-top: 16px; padding: 20px; border-radius: 16px; background: var(--paper); }
      .empty h1 { font-size: 16px; font-weight: 500; }
      .empty p { margin-top: 4px; color: var(--muted); }
      .link { display: inline-block; margin-top: 16px; color: var(--ink); text-underline-offset: 4px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <p class="mark">FocusLearn<sup>®</sup></p>

    <section id="video" hidden>
      <div class="card">
        <img id="thumb" class="thumb" alt="" />
        <p id="title" class="title"></p>
        <p id="meta" class="meta"></p>
      </div>
      <button id="open" class="open">Open in FocusLearn ↗</button>
    </section>

    <section id="none" class="empty" hidden>
      <h1>No YouTube video detected</h1>
      <p>Open a video on YouTube, then click here to watch it without the noise.</p>
      <a id="home" class="link" href="#">Go to FocusLearn ↗</a>
    </section>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
